<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Developer Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">folio</span>
    <form id="lookup" class="lookup" role="search">
      <label for="username" class="sr-only">GitHub username</label>
      <input id="username" name="username" placeholder="GitHub username" autocomplete="off" required>
      <button type="submit">Show portfolio</button>
    </form>
  </header>

  <main id="app">
    <p id="status" class="status" role="status">Enter a GitHub username to build a portfolio.</p>

    <section id="profile" class="profile" hidden>
      <div class="match-area">
        <button id="match-open" class="match-open" type="button">Check fit for a job</button>
        <div id="match-badge" class="match-badge" hidden></div>
        <div id="advice" class="advice" hidden>
          <h3>Improve your match</h3>
          <ul id="advice-list"></ul>
        </div>
      </div>
      <dialog id="match-dialog" class="match-dialog" aria-labelledby="match-title">
        <form id="match-form">
          <h2 id="match-title">Check fit for a job</h2>
          <label for="jd">Paste the job description. We'll compare the languages it asks for with the ones in these repositories.</label>
          <textarea id="jd" rows="12" minlength="10" maxlength="20000" required placeholder="e.g. We're hiring a backend engineer with Python, Go and PostgreSQL experience…"></textarea>
          <p id="match-error" class="match-error" role="alert" hidden></p>
          <div class="dialog-actions">
            <button type="button" id="match-cancel" class="secondary">Cancel</button>
            <button type="submit">Check match</button>
          </div>
        </form>
      </dialog>
      <div class="identity">
        <img id="avatar" class="avatar" alt="">
        <div>
          <h1 id="name" class="name"></h1>
          <a id="handle" class="handle" target="_blank" rel="noopener"></a>
          <p id="bio" class="bio"></p>
        </div>
      </div>
      <dl class="stats">
        <div><dt>Followers</dt><dd id="followers"></dd></div>
        <div><dt>Total stars</dt><dd id="stars"></dd></div>
        <div><dt>Public repos</dt><dd id="repo-count"></dd></div>
      </dl>
      <figure class="languages">
        <figcaption>Top languages</figcaption>
        <div class="chart-wrap"><canvas id="lang-chart" aria-label="Top languages chart"></canvas></div>
        <ul id="lang-legend" class="legend"></ul>
      </figure>
    </section>

    <section id="activity" class="activity" hidden>
      <h2>Contribution activity</h2>
      <p id="activity-summary" class="activity-summary"></p>
      <div class="heatmap-scroll"><div id="heatmap" class="heatmap" role="img"></div></div>
      <div class="heat-key" aria-hidden="true">Less <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> More</div>
    </section>

    <section id="repos-section" class="repos-section" hidden>
      <h2>Repositories</h2>
      <ul id="repos" class="repos"></ul>
    </section>
  </main>

  <button id="chat-toggle" class="chat-toggle" type="button" aria-expanded="false" aria-controls="chat" hidden>Ask about this portfolio</button>
  <aside id="chat" class="chat" aria-label="Portfolio assistant" hidden>
    <header class="chat-head">
      <h2>Portfolio assistant</h2>
      <button id="chat-close" type="button" aria-label="Close assistant">×</button>
    </header>
    <ol id="chat-log" class="chat-log" aria-live="polite"></ol>
    <div id="chat-suggestions" class="chat-suggestions"></div>
    <form id="chat-form" class="chat-form">
      <label for="chat-input" class="sr-only">Ask a question</label>
      <input id="chat-input" maxlength="500" autocomplete="off" placeholder="Ask about languages, repos, streaks…" required>
      <button type="submit">Send</button>
    </form>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
